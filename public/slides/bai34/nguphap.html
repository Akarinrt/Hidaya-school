<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngữ Pháp Bài 34</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/white.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%) !important;
        }
        .reveal p, .reveal li {
            font-size: 1.6rem !important;
            line-height: 1.6 !important;
            color: #0b1f38 !important;
        }
        .reveal h1, .reveal h2, .reveal h3 {
            background: none !important;
            -webkit-text-fill-color: #0052cc !important;
            text-shadow: none !important;
            font-weight: 800 !important;
        }
        .box-highlight {
            font-size: 1.8rem !important;
            background: #ffffff !important;
            border-left: 8px solid #0052cc !important;
            border-radius: 12px !important;
            padding: 25px !important;
            color: #0052cc !important;
            box-shadow: 0 15px 35px rgba(0, 82, 204, 0.1) !important;
            font-weight: bold;
        }
        .grammar-example {
            font-size: 1.8rem !important;
            padding: 25px !important;
            background: #ffffff !important;
            border: 2px solid #e1efff !important;
            border-radius: 16px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05) !important;
        }
        .trans {
            font-size: 1.4rem !important;
            color: #5c728a !important;
            display: block;
            margin-top: 10px;
        }
        /* Furigana Toggler */
        .hide-furigana rt {
            display: none !important;
        }
        .furi-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 9999;
            background: #0052cc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button class="furi-toggle-btn" onclick="toggleFurigana()">Toggle Furigana</button>

    <div class="reveal"><div class="slides">
        <section class="title-slide">
            <h1>Bài 34 - Quy trình & Trạng thái</h1>
            <h3>Giáo án ngữ pháp tiếng Nhật N4</h3>
            <div style="margin-top: 30px;">
                <a href="kanji.html" style="font-size: 1.2rem; background: #1976d2; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none;">Chuyển sang Kanji Bài 34</a>
            </div>
        </section>

        
        <section>
            <h2>I. 1. V1 とおりに V2 (Theo như...)</h2>
            <div class="grammar-example fragment">
                <p>私が言ったとおりに、書いてください。</p>
                <span class="trans">Hãy viết theo đúng những gì tôi nói.</span>
            </div>
        </section>
        <section>
            <h2>II. 2. V1 あとで V2 (Sau khi...)</h2>
            <div class="grammar-example fragment">
                <p>仕事が終わったあとで、飲みに行きます。</p>
                <span class="trans">Sau khi xong việc tôi đi uống nước.</span>
            </div>
        </section>
        

    </div></div>

    <!-- Vocab Box -->
    <div id="vocab-box" class="vocab-box" style="position:fixed; top:70px; right:15px; width:220px; max-height:400px; overflow-y:auto; background:rgba(255,255,255,0.9); border:2px solid #0052cc; border-radius:12px; padding:15px; z-index:999; box-shadow:0 10px 25px rgba(0,0,0,0.1); cursor:move;">
        <h4 id="vocab-header" style="margin:0 0 10px 0; color:#0052cc;">Từ Vựng Trang Này</h4>
        <div id="vocab-list" style="font-size:0.9rem; line-height:1.4;"></div>
    </div>

    <!-- Reveal.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
    <script>
        Reveal.initialize({
            controls: true,
            progress: true,
            center: true,
            hash: true,
            transition: 'slide'
        });

        const vocabDict = {"\u3068\u304a\u308a\u306b": "theo nh\u01b0", "\u3042\u3068\u3067": "sau khi", "\u3057\u3087\u3046\u3086": "n\u01b0\u1edbc t\u01b0\u01a1ng"};
        const furiganaDict = {"\u3068\u304a\u308a\u306b": "\u901a\u308a\u306b", "\u3042\u3068\u3067": "\u5f8c\u3067", "\u3057\u3087\u3046\u3086": "\u91a4\u6cb9"};

        function toggleFurigana() {
            const slides = document.querySelector('.slides');
            slides.classList.toggle('hide-furigana');
        }

        function updateVocab() {
            const currentSlide = Reveal.getCurrentSlide();
            if (!currentSlide) return;
            
            let rawHtml = currentSlide.innerHTML;
            const list = document.getElementById('vocab-list');
            list.innerHTML = '';
            let foundAny = false;
            
            let keys = Object.keys(vocabDict).sort((a, b) => b.length - a.length);
            for (let key of keys) {
                let cleanText = rawHtml.replace(/<rt>.*?<\/rt>/g, '').replace(/<[^>]+>/g, '');
                if (cleanText.includes(key)) {
                    let div = document.createElement('div');
                    div.style.marginBottom = '4px';
                    let displayWord = furiganaDict[key] || key;
                    div.innerHTML = `<strong>* ${displayWord}:</strong> ${vocabDict[key]}`;
                    list.appendChild(div);
                    foundAny = true;
                }
            }
            if (!foundAny) {
                list.innerHTML = '<div style="color:#aaa; font-style:italic;">Không có từ vựng ở trang này</div>';
            }
        }

        Reveal.on('slidechanged', updateVocab);
        Reveal.on('ready', updateVocab);

        // Make vocab box draggable
        const box = document.getElementById('vocab-box');
        let isDragging = false;
        let offsetX, offsetY;
        box.addEventListener('mousedown', e => {
            isDragging = true;
            offsetX = e.clientX - box.getBoundingClientRect().left;
            offsetY = e.clientY - box.getBoundingClientRect().top;
        });
        document.addEventListener('mousemove', e => {
            if (isDragging) {
                box.style.left = (e.clientX - offsetX) + 'px';
                box.style.top = (e.clientY - offsetY) + 'px';
                box.style.right = 'auto';
            }
        });
        document.addEventListener('mouseup', () => isDragging = false);

        function toggleAnswer(btn) {
            const content = btn.nextElementSibling;
            if (content.style.display === 'none' || content.style.display === '') {
                content.style.display = 'block';
                btn.innerText = 'Ẩn đáp án';
            } else {
                content.style.display = 'none';
                btn.innerText = 'Xem đáp án';
            }
        }
    </script>
    <script src="whiteboard.js"></script>
</body>
</html>
