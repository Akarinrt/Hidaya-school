<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Bài 30</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/white.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%) !important;
        }
        .kanji-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .kanji-card {
            background: #ffffff !important;
            border-radius: 20px !important;
            padding: 20px !important;
            box-shadow: 0 10px 30px rgba(0, 82, 204, 0.1) !important;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease !important;
            display: flex;
            align-items: center;
        }
        .kanji-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 20px 40px rgba(0, 82, 204, 0.2) !important;
        }
        .kanji-char-box {
            width: 90px;
            text-align: center;
            cursor: pointer;
        }
        .kanji-svg-container {
            width: 80px; height: 80px;
            background: #f0f7ff !important;
            border: 2px solid #cce4ff !important;
            border-radius: 16px !important;
            display: flex; justify-content: center; align-items: center;
        }
        .kanji-details {
            margin-left: 20px;
            text-align: left;
            flex-grow: 1;
        }
        .kanji-reading span {
            font-weight: bold;
            color: #d32f2f;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: white;
            font-weight: bold;
        }
        .badge.on { background: #ff6b6b; }
        .badge.kun { background: #20c997; }
        
        /* Modal */
        #kanji-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        #kanji-modal.active { display: flex; }
        #modal-char-container { width: 250px; height: 250px; background: white; border-radius: 16px; padding: 20px; display: flex; justify-content: center; align-items: center; }
        #modal-meaning { font-size: 2.5rem; color: #ffb7b2; font-weight: bold; }
        #modal-memo { font-size: 1.2rem; color: #ddd; max-width: 600px; text-align: left; line-height: 1.5; }
        .close-btn { position: absolute; top: 20px; right: 40px; font-size: 3rem; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="reveal"><div class="slides">
        <section class="title-slide">
            <h1>Từ Vựng Kanji Bài 30 - 置 - 飾</h1>
            <h3>Giáo án chữ Hán N4</h3>
            <div style="margin-top: 30px;">
                <a href="nguphap.html" style="font-size: 1.2rem; background: #1976d2; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none;">Quay lại Ngữ Pháp Bài 30</a>
            </div>
        </section>

        <section>
            <h2>Bảng Chữ Hán Bài 30</h2>
            <div class="kanji-grid">
                
        <div class="kanji-card fragment">
            <div class="kanji-char-box" onclick="showModal('置', 'Trí')">
                <div class="kanji-svg-container"><span style="font-size:3rem;">置</span></div>
                <div class="kanji-meaning">Trí</div>
            </div>
            <div class="kanji-details">
                <div class="kanji-reading"><span class="badge on">ON</span> チ | <span class="badge kun">KUN</span> お(く)</div>
                <div class="kanji-ex">置く (đặt, để), 位置 (vị trí)</div>
            </div>
        </div>
        
            </div>
        </section>
    </div></div>

    <!-- Modal for Zoom -->
    <div id="kanji-modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-char-container"></div>
        <div id="modal-meaning"></div>
        <div id="modal-memo"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.js"></script>
    <script>
        Reveal.initialize({
            controls: true,
            progress: true,
            center: true,
            hash: true
        });

        const modalDetails = {"\u7f6e": "<p>Ph\u00e2n t\u00edch: \u0110\u1eb7t c\u00e1i g\u00ec \u0111\u00f3 \u1edf v\u1ecb tr\u00ed th\u00edch h\u1ee3p.</p>"};

        function showModal(char, meaning) {
            const container = document.getElementById('modal-char-container');
            document.getElementById('modal-meaning').innerText = meaning;
            document.getElementById('modal-memo').innerHTML = modalDetails[char] || "Không có chi tiết";
            container.innerHTML = `<span style="font-size:8rem; font-weight:bold; color:#1976d2;">${char}</span>`;
            document.getElementById('kanji-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('kanji-modal').classList.remove('active');
        }
    </script>
    <script src="whiteboard.js"></script>
</body>
</html>
