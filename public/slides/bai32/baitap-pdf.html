<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài tập Bài 32</title>
  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f9;
      color: #333;
    }
    .page {
      width: 210mm;
      min-height: 297mm;
      padding: 20mm;
      margin: 10mm auto;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
      font-size: 14pt;
      line-height: 1.8;
      page-break-after: always;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 24pt;
    }
    .name-section {
      text-align: right;
      font-size: 16pt;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .exercise {
      margin-bottom: 30px;
    }
    .exercise-title {
      font-weight: bold;
      font-size: 16pt;
      margin-bottom: 10px;
    }
    .example {
      color: #555;
    }
    .blank {
      display: inline-block;
      border-bottom: 1px solid #333;
      min-width: 150px;
    }
    .blank-long {
      display: inline-block;
      border-bottom: 1px solid #333;
      min-width: 250px;
    }
    .word-box {
      border: 1px solid #333;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 13pt;
      border-radius: 5px;
    }
    @media print {
      body { background: white; }
      .page {
        margin: 0;
        box-shadow: none;
        width: 100%;
        padding: 10mm;
      }
      .no-print { display: none; }
    }
    .print-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #1976d2;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .print-btn:hover { background: #1565c0; }
  </style>
</head>
<body>
  <button class="print-btn no-print" onclick="window.print()">🖨 Xuất file PDF</button>

  <div class="page">
    <div class="header">
      <h1>第 32 課 - 練習</h1>
    </div>
    <div class="name-section">
      名前：<span class="blank-long"></span>
    </div>
    
    <div class="exercise">
      <div class="exercise-title">1. ～ほうがいいです (Lời khuyên nên / không nên)</div>
      <div class="example">例：毎日運動を（ <u>した</u> ）ほうがいいです。</div>
      <div>1) 熱がある時は、お風呂に（ <span class="blank"></span> ）ほうがいいです。 (入りません)</div>
      <div>2) 早く（ <span class="blank"></span> ）ほうがいいですよ。薬を飲んでください。 (寝ます)</div>
      <div>3) 甘いものをあまり（ <span class="blank"></span> ）ほうがいいです。 (食べません)</div>
    </div>
    <div class="exercise">
      <div class="exercise-title">2. ～でしょう / ～かもしれません (Dự đoán)</div>
      <div>1) 明日は雨が（ <span class="blank"></span> ）でしょう。 (降ります)</div>
      <div>2) 約束の時間に（ <span class="blank"></span> ）かもしれません。 (遅れます)</div>
      <div>3) 故障かもしれないから、電気屋に（ <span class="blank"></span> ）ほうがいいです。 (見せます)</div>
    </div>
    
  </div>
</body>
</html>
